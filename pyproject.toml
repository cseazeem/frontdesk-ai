[project]
name = "frontdesk-ai"
version = "0.1.0"
description = "Voice AI receptionist for a US primary-care clinic, with an automated caller simulator and call review dashboard."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pipecat-ai[google,runner,silero,webrtc]>=1.17.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
